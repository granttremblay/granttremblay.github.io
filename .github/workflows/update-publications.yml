name: Update publications from NASA SciX / ADS

# Keeps _data/publications.json current by querying ADS (NASA SciX) by ORCID.
#
# SETUP (one time):
#   1. Get a free API token at https://ui.adsabs.harvard.edu/user/settings/token
#      (NASA SciX uses the same API/token.)
#   2. In this repo: Settings → Secrets and variables → Actions → New repository
#      secret, named  ADS_TOKEN  with the token as its value.
#   3. Settings → Actions → General → Workflow permissions → enable
#      "Read and write permissions" so the workflow can commit the refreshed data.
#
# Until the secret is set, the script falls back to Crossref so the list still
# updates (with somewhat less coverage).

on:
  schedule:
    - cron: "0 7 * * 1"      # every Monday 07:00 UTC
  workflow_dispatch: {}       # allow manual runs from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch publications
        env:
          ADS_TOKEN: ${{ secrets.ADS_TOKEN }}
        run: python3 scripts/fetch_publications.py

      - name: Commit changes if any
        run: |
          if git diff --quiet -- _data/publications.json; then
            echo "No changes to publications."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/publications.json
          git commit -m "Auto-update publications from NASA SciX / ADS"
          git push
